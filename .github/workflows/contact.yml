name: Contacts ZAHR
on:
  schedule:
    - cron: '0 8 * * 1-5'   # du lundi au vendredi, 9 h heure de Paris (10 h en été)
  workflow_dispatch:
permissions:
  contents: write
concurrency: contacts
jobs:
  contact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save nodemailer@6
      - run: node scripts/contact.mjs
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Enregistrer le journal des contacts
        run: |
          git config user.name "zahr-veille"
          git config user.email "actions@users.noreply.github.com"
          git add data/contacts.json
          git diff --staged --quiet || git commit -m "Contacts du $(date +%F)"
          git pull --rebase && git push
